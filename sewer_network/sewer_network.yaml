Pipe3:
  manhole: Manhole1
  entry_depth: 1.2
  segment_length: 2.0
  segment_count: 3
  socket_length: 0.1  # The bulged end of the pipe to incorporate the next one
  gradient: 1/300
  outer_diameter: 0.5
  wall_thickness: 0.025
  angle: 0
  outgoing: True

Pipe4:
  between: [Manhole1, Manhole2]    # water flows from Manhole1 to Manhole2
  entry_depth: 1.2                 # depth of the pipe's centre line at Manhole1
  segment_length: 1.0
  socket_length: 0.1
  gradient: 1/300
  outer_diameter: 0.8
  wall_thickness: 0.025


