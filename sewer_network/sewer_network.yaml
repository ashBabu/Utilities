Manhole1:
  start_coordinate: [0.0, 0.0, 0.0]
  outer_diameter: 3.0
  height: 1.7
  wall_thickness: 0.2
  floor_thickness: 0.3

Manhole2:
  start_coordinate: [8.0, 8.0, 0.0]
  outer_diameter: 3.0
  height: 1.7
  wall_thickness: 0.2
  floor_thickness: 0.3

Pipe1:
  manhole: Manhole1
  entry_depth: 1.2
  segment_length: 3.0
  segment_count: 3
  socket_length: 0.1  # The bulged end of the pipe to incorporate the next one
  gradient: 1/300
  outer_diameter: 1.0
  wall_thickness: 0.025
  angle: 180
  outgoing: False

